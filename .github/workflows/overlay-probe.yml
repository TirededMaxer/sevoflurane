name: Embedded overlay prototype
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compositor:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal compositor and run Metal pixel check
        run: bash Tools/embedded-overlay/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-overlay-${{ github.sha }}
          path: ${{ runner.temp }}/sevo-overlay/
          if-no-files-found: error
          retention-days: 3
