name: Cloud build and release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified build and retain only the newest Release
        type: boolean
        default: true
      run_tests:
        description: Run the test suites before building
        type: boolean
        default: true
      build_run_id:
        description: Optional previously verified build run, for retrying publication only
        type: string
        default: ''

concurrency:
  group: sevoflurane-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      SEVO_EMBED_ENGINE: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Restore a verified cloud build for publication retry
        if: inputs.build_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          pattern: sevoflurane-*
          merge-multiple: true
          path: ${{ runner.temp }}/sevo-output/
      - name: Test on a fresh Apple Silicon runner
        if: inputs.build_run_id == '' && inputs.run_tests
        timeout-minutes: 12
        run: bash Tools/ci/build.sh test
      - name: Build the Release application
        if: inputs.build_run_id == ''
        timeout-minutes: 20
        run: bash Tools/ci/build.sh release
      - name: Sign, verify and package
        if: inputs.build_run_id == ''
        env:
          SEVO_SKIP_TESTS: ${{ !inputs.run_tests }}
        run: python3 Tools/ci/package.py
      - name: Upload build and test evidence
        if: always() && inputs.build_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: sevoflurane-${{ github.sha }}
          path: ${{ runner.temp }}/sevo-output/
          if-no-files-found: error
          retention-days: 7
      - name: Publish verified Release and remove predecessors
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          SEVO_BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python3 Tools/ci/publish.py
