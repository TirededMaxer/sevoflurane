name: REA native engine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned official Ghidra decompiler on fresh Apple Silicon
        run: python3 Tools/ci/build-ghidra-native.py
      - uses: actions/upload-artifact@v4
        with:
          name: sevo-ghidra-native-${{ github.sha }}
          path: ${{ runner.temp }}/sevo-ghidra-output/
          retention-days: 3
          if-no-files-found: error
